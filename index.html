<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transport Week</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#070b16;--card:#0d1424;--card2:#121a30;--border:#1f2a48;--text:#e8ecf8;--muted:#8d99b8;--a:#2f4fe0;--b:#0021A5;--c:#FA4616;--peri:#9bb0ff;--cream:#fff1e8;--good:#3ddc97;--display:"Big Shoulders Display","Arial Narrow",Impact,system-ui,sans-serif;--ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);line-height:1.45;min-height:100vh;padding:16px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px}
h1{margin:0 0 6px;font:900 clamp(34px,9vw,52px)/.95 var(--display);text-transform:uppercase;text-align:center}
.sub{margin:0 0 18px;text-align:center;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-size:.78rem;font-weight:600}
.btn-main{display:block;width:100%;padding:15px;border:0;border-radius:12px;font-weight:700;font-size:1.05rem;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--a),var(--b))}
.btn-sec{padding:11px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card2);cursor:pointer;font-weight:600}
.btn-sec.armed{background:#7a2a10;border-color:var(--c);color:#fff}
.inp{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-size:1.1rem;margin:6px 0 14px}
.lbl{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-size:.85rem}
.err{color:#ff9a9a;margin:0 0 12px}
.signature{margin-top:26px;text-align:center;font-style:italic;font-size:.72rem;color:var(--muted);opacity:.6}

.tiles{display:grid;gap:12px;margin-top:6px}
.tile{display:block;text-decoration:none;color:inherit;padding:18px;border-radius:16px;border:1px solid var(--border);background:var(--card2)}
.tile:hover{border-color:var(--c)}
.tile b{display:block;font:900 26px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.tile span{color:var(--muted);font-size:.9rem}
.tile.static{opacity:.85;cursor:default}.tile.static:hover{border-color:var(--border)}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;color:var(--muted);font-size:.9rem}
.who b{color:var(--text)}
.host-badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:rgba(250,70,22,.2);color:#ff9a66;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.lbwrap{margin-top:26px}
.lbwrap h2{margin:0 0 10px;font-size:.9rem;letter-spacing:.18em;text-transform:uppercase;color:#9db2ff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{flex:1;min-width:80px;padding:9px 6px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font:700 .72rem var(--ui);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tabs button.on{color:#fff;border-color:var(--c);background:rgba(250,70,22,.14)}
.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}
.row.me{background:rgba(250,70,22,.12);border-radius:10px}
.row .rk{font:900 22px/1 var(--display);color:var(--c);min-width:32px}
.row .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tm{font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.note{margin:12px 0 0;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="root"></div><div class="signature">Built by Atticus for Transport Week, November 2026</div></div>
<script>
(function(){
// An old trivia join link or QR code (index.html?r=CODE) still works: send it to the trivia page.
if(/[?&]r=/.test(location.search)){location.replace('trivia.html'+location.search);return;}
function sget(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function sset(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function scramble(str){
  var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;
  for(i=0;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+(h1>>>0).toString(36);
}

function el(tag,attrs){var e=document.createElement(tag);if(attrs)Object.keys(attrs).forEach(function(k){if(k==='on'){Object.keys(attrs.on).forEach(function(ev){e.addEventListener(ev,attrs.on[ev]);});}else if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k]);});
  [].slice.call(arguments,2).forEach(function(c){if(c==null)return;(Array.isArray(c)?c:[c]).forEach(function(x){e.append(x.nodeType?x:document.createTextNode(String(x)));});});return e;}
var root=document.getElementById('root');
function clean(v){return String(v||'').replace(/\s+/g,' ').trim().slice(0,16);}
function login(){
  var inp=el('input',{class:'inp',id:'u',type:'text',maxlength:'16',autocomplete:'off',autocapitalize:'words',placeholder:'Username',value:sget('brt.user')||''});
  var err=el('p',{class:'err',hidden:''});
  function go(e){e.preventDefault();var n=clean(inp.value);if(!n){err.textContent='Type a username first.';err.hidden=false;return;}
    sset('brt.user',n);sset('brt.left','');sset('brt.name',n);render();}
  root.replaceChildren(el('h1',null,'Transport Week'),el('p',{class:'sub'},'Games'),
    el('form',{on:{submit:go}},el('label',{class:'lbl','for':'u'},'Pick a username'),inp,err,
      el('p',{class:'sub',style:'text-align:left;letter-spacing:0;text-transform:none;font-size:.85rem;margin:-6px 0 14px'},'You can use a nickname, but please keep it appropriate. Try to come up with something unique no one else will pick. Your scores in every game are saved under this name.'),
      el('button',{class:'btn-main',type:'submit'},'Continue')),adminBox());
  inp.focus();
}
function hostLink(){return el('a',{class:'tile',href:'host.html',style:'margin-bottom:16px;padding:14px;text-align:center;border-style:dashed'},el('b',{style:'font-size:20px;margin:0'},'Hosting an event?'),el('span',null,'Open the host tools (passcode needed)'));}
var LBD={tab:'trivia',data:{},hidden:false,db:null,started:false};
var LBB=[['trivia','Trivia best'],['total','Trivia total'],['arcade','Wheelchair'],['stack','Game timer']];
var LBN={trivia:'Highest score in a single trivia game.',total:'All trivia points added up.',arcade:'Best Wheelchair Run score.',stack:'Fastest game timer time.'};
function lbKey(n){return String(n||'').toLowerCase().replace(/[.$#\[\]\/\s]+/g,'_').slice(0,32)||'_';}
function fmtN(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function fmtT(ms){var s=ms/1000;if(s<60)return s.toFixed(2)+'s';var m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(2).padStart(5,'0');}
function lbDraw(){
  var box=document.getElementById('lbbox');if(!box)return;
  var kids=[el('h2',null,'Leaderboards')];
  if(LBD.hidden&&sget('brt.adminok')!=='eelyiy1bbww01'){kids.push(el('p',{class:'note'},'Leaderboards are hidden right now. Check back later.'));}
  else{
    kids.push(el('div',{class:'tabs'},LBB.map(function(b){return el('button',{type:'button','class':b[0]===LBD.tab?'on':'',on:{click:function(){LBD.tab=b[0];lbDraw();}}},b[1]);})));
    var o=LBD.data[LBD.tab]||{},isT=LBD.tab==='stack',me=lbKey(sget('brt.user'));
    var rows=Object.keys(o).map(function(k){return {k:k,n:o[k].n,s:o[k].s||0,t:o[k].t||0};}).sort(function(a,b){return isT?(a.s-b.s||a.t-b.t):(b.s-a.s||a.t-b.t);}).slice(0,25);
    if(!rows.length)kids.push(el('p',{class:'note'},'Nothing on this board yet.'));
    rows.forEach(function(r,i){kids.push(el('div',{class:'row'+(r.k===me?' me':'')},el('span',{class:'rk'},String(i+1)),el('span',{class:'nm'},r.n||r.k),el('span',{class:'tm'},isT?fmtT(r.s):fmtN(r.s))));});
    kids.push(el('p',{class:'note'},LBN[LBD.tab]));
  }
  box.replaceChildren.apply(box,kids);
}
function lbStart(){
  if(LBD.started)return;LBD.started=true;
  try{firebase.initializeApp({databaseURL:'https://transport-week-trivia-default-rtdb.firebaseio.com'});LBD.db=firebase.database();}catch(e){return;}
  LBD.db.ref('rooms/TWEEK/lb').on('value',function(sn){LBD.data=sn.val()||{};lbDraw();});
  LBD.db.ref('rooms/TWEEK/lbhidden').on('value',function(sn){LBD.hidden=!!sn.val();lbDraw();});
}
var TRIVIA_FORM='https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=D8x6Ko0Q8Uyx_0D6F7gwzq085dwmUlpEiaflC7FXq8JUOUxJVkc0U1kwNjAzUUVCNUpXSjA0SUU2QS4u';  // paste your Microsoft Forms link between the quotes
function formBtn(){return TRIVIA_FORM?el('a',{class:'tile',href:TRIVIA_FORM,target:'_blank',rel:'noopener noreferrer',style:'margin-top:16px;padding:14px;text-align:center;border-style:dashed'},el('b',{style:'font-size:20px;margin:0'},'Submit a trivia question')):null;}
function adminBox(){return el('p',{style:'text-align:center;margin:22px 0 0'},el('a',{class:'link',href:'host.html'},'Host tools'),' \u00b7 ',el('a',{class:'link',href:'admin.html'},'Admin'));}
function home(){
  var u=sget('brt.user');
  var tiles=[
    el('a',{class:'tile',href:'schedule.html'},el('b',null,'Schedule'),el('span',null,'Lunch, games and prizes for every day of the week.')),
    el('a',{class:'tile',href:'trivia.html?r=TWEEK'},el('b',null,'Trivia'),el('span',null,'Join the live game. Answer fast for bonus points.')),
    el('a',{class:'tile',href:'wheelchair.html'},el('b',null,'Wheelchair Run'),el('span',null,'Jump the hospital obstacles. Beat the best score.')),
    el('a',{class:'tile',href:'timer.html'},el('b',null,'Game Timer'),el('span',null,'Hold, let go to start, touch to stop. Fastest time wins when the host opens it.'))
  ];
  var out=el('button',{class:'link',type:'button',on:{click:function(){sset('brt.user','');sset('brt.name','');sset('brt.joined','0');render();}}},'Not you? Log out');
  root.replaceChildren(el('h1',null,'Transport Week'),el('p',{class:'sub'},'Games'),
    el('div',{class:'who'},el('span',null,'Logged in as ',el('b',null,u),null),out),
    el('div',{class:'tiles'},tiles),formBtn(),el('div',{class:'lbwrap',id:'lbbox'}),adminBox());
  lbStart();lbDraw();
}
function render(){if(sget('brt.user'))home();else login();}
render();
})();
</script>
</body>
</html>
